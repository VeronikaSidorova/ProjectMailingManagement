{% extends 'base.html'%}

{% block title %}Форма добавления рассылки{% endblock %}

{% block content %}
<h2>Форма добавления рассылки</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Сохранить</button>
    <a href="{% url 'mailings:campaign_list' %}" class="btn btn-lg btn-block btn-outline-secondary">Отменить</a>
</form>
{% endblock %}
