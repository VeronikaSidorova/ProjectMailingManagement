{% extends 'base.html'%}

{% block title %}Форма удаления получателя{% endblock %}

{% block content %}
<h2>Форма удаления получателя</h2>
<p>Вы действительно хотите удалить {{ recipient.full_name }}?</p>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <button type="submit" class="btn btn-lg btn-block btn-outline-danger">Подтвердить</button>
    <a href="{% url 'mailings:recipient_detail' recipient.pk %}" class="btn btn-lg btn-block btn-outline-primary">Отменить</a>
</form>
{% endblock %}
