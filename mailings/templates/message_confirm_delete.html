{% extends 'base.html'%}

{% block title %}Форма удаления сообщения{% endblock %}

{% block content %}
<h2>Форма удаления сообщения</h2>
<p>Вы действительно хотите удалить {{ message.subject }}?</p>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <button type="submit" class="btn btn-lg btn-block btn-outline-danger">Подтвердить</button>
    <a href="{% url 'mailings:message_detail' message.pk %}" class="btn btn-lg btn-block btn-outline-primary">Отменить</a>
</form>
{% endblock %}
