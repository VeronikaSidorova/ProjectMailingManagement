{% extends 'base.html'%}

{% block title %}Форма добавления получателя{% endblock %}

{% block content %}
<h2>Форма добавления получателя</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Сохранить</button>
    <a href="{% url 'mailings:recipient_list' %}" class="btn btn-lg btn-block btn-outline-secondary">Отменить</a>
</form>
{% endblock %}
