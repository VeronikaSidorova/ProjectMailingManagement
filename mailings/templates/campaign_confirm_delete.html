{% extends 'base.html'%}

{% block title %}Форма удаления рассылки{% endblock %}

{% block content %}
<h2>Форма удаления рассылки</h2>
<p>Вы действительно хотите удалить {{ campaign.message }}?</p>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <button type="submit" class="btn btn-lg btn-block btn-outline-danger">Подтвердить</button>
    <a href="{% url 'mailings:campaign_detail' campaign.pk %}" class="btn btn-lg btn-block btn-outline-primary">Отменить</a>
</form>
{% endblock %}
