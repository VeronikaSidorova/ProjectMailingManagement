{% extends 'base.html'%}
{% block title %}Детали получателя{% endblock %}
{% block content %}
<div class="row text-center">
    <div class="col-12">
        <div class="card mb-4 box-shadow">
            <div class="card-header">
                <h5 class="my-0 font-weight-normal">{{recipient.full_name}}</h5>
            </div>
            <div class="card-body">
                <ul class="list-unstyled mt-3 mb-4 text-start m-3" style="min-height: 120px;">
                    <li>
                        Комментарий:
                        {% if recipient.comment %}
                            {{ recipient.comment }}
                        {% else %}
                            Нет комментария
                        {% endif %}
                    </li>
                    <li>
                        E-mail: {{recipient.email}}
                    </li>
                </ul>
                <a href="{% url 'mailings:recipient_list' %}" class="btn btn-lg btn-block btn-outline-primary">Назад</a>
                <a href="{% url 'mailings:recipient_edit' recipient.pk %}" class="btn btn-lg btn-block btn-outline-secondary">Редактировать</a>
                <a href="{% url 'mailings:recipient_delete' recipient.pk %}" class="btn btn-lg btn-block btn-outline-danger">Удалить</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
